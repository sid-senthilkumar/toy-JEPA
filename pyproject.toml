[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lewm-aladip-toy"
version = "0.1.0"
description = "LeWM latent world model on alanine dipeptide — toy stage"
requires-python = ">=3.10"

# Dependencies are left empty — populate based on architecture and tooling choices.
# Account for the aarch64/ARM64 environment: some wheels require the NVIDIA package
# index or building from source.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
